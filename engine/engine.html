<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Brico;src:url(fonts/Bricolage.ttf);font-weight:200 800;font-stretch:75% 100%}
@font-face{font-family:Inter;src:url(fonts/InterTight.ttf);font-weight:100 900}
@font-face{font-family:Mono;src:url(fonts/JetBrainsMono.ttf);font-weight:100 800}
@font-face{font-family:Serif;src:url(fonts/InstrumentSerif-Italic.ttf);font-style:italic}
:root{--ink:#0E0D0C;--ink2:#1B1A18;--paper:#F3EEE5;--hot:#FF5A1F;--lime:#D4FF3A;--mute:#8C857A;
 /* tonos derivados (papel→tinta); con una marca se recalculan desde sus colores (scripts/brand.js) */
 --p1:#EFEAE0;--p2:#E9E3D8;--p3:#E6DFD2;--p4:#E2DACB;--p5:#DDD5C7;--p6:#CFC6B6;--t1:#a49d92;--t2:#6c665d;
 --d1:#1c1b19;--d2:#2e2c29;--d3:#3a3834;--d4:#4a463f;--d5:#57524a}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
#stage{position:absolute;inset:0;overflow:hidden}
*{box-sizing:border-box}
.disp{font-family:Brico;font-weight:800;font-stretch:76%;letter-spacing:-.02em;line-height:.9;text-transform:uppercase}
.mono{font-family:Mono;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.ui{font-family:Inter}
.serif{font-family:Serif;font-style:italic;font-weight:400;text-transform:none;letter-spacing:-.01em}
.m{overflow:hidden;display:block;padding:.16em 0 .06em;margin:-.16em 0 -.06em}
.m>div{display:block;will-change:transform}
.m.serif{padding-bottom:.24em;margin-bottom:-.24em}
.ch{display:inline-block;will-change:transform}
.grain{position:absolute;inset:-200px;pointer-events:none;opacity:.10;mix-blend-mode:overlay;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:90px 90px}
.gridp{position:absolute;inset:0;background-image:linear-gradient(rgba(0,0,0,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.06) 1px,transparent 1px);background-size:90px 90px}
.card{position:absolute;left:60px;width:960px;background:var(--paper);color:var(--ink);border-radius:36px;padding:44px 48px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.kick{display:inline-flex;align-items:center;gap:14px;font-family:Mono;font-weight:700;font-size:26px;letter-spacing:.12em;text-transform:uppercase}
.dot{width:14px;height:14px;border-radius:50%;background:var(--hot)}
.item{display:flex;align-items:center;gap:26px;font-family:Inter;font-weight:700;font-size:50px;letter-spacing:-.02em;line-height:1.05;position:relative}
.ico{flex:0 0 72px;height:72px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-family:Inter;font-weight:900;font-size:40px}
.strike{position:absolute;left:96px;top:52%;height:7px;background:var(--hot);border-radius:4px;transform-origin:left center}
</style></head><body><div id="stage"></div><script>
const S=document.getElementById('stage');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,d)=>cl((t-a)/(d||1e-6));
const E={o3:x=>1-Math.pow(1-x,3),expo:x=>x>=1?1:1-Math.pow(2,-10*x),
 back:x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)},
 io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
 el:x=>x<=0?0:x>=1?1:Math.pow(2,-10*x)*Math.sin((x*10-.75)*2*Math.PI/3)+1,
 i3:x=>x*x*x};
const L=(a,b,x)=>a+(b-a)*x;
function h(tag,css,parent,html,cls){const e=document.createElement(tag);if(css)e.style.cssText=css;if(cls)e.className=cls;if(html!=null)e.innerHTML=html;(parent||S).appendChild(e);return e}
function ml(parent,html,css,cls){const m=h('div',css||'',parent,null,'m '+(cls||''));return h('div','',m,html)}
function rise(el,t,a,d=.55,ez=E.expo){const x=ez(P(t,a,d));el.style.transform=`translateY(${(1-x)*140}%)`;}
function split(el){const txt=el.textContent;el.innerHTML='';return [...txt].map(c=>h('span','',el,c===' '?'&nbsp;':c,'ch'))}
function svg(html,css,parent){const d=h('div',css,parent);d.innerHTML=html;return d}
let DUR=1,FRAME=0;
// ---------- wrappers ----------
// Fullscreen: layered wipe in from bottom, wipe out to top
function FS(bg,accent){
 const a=h('div',`position:absolute;inset:0;background:${accent||'var(--hot)'}`);
 const m=h('div',`position:absolute;inset:0;background:${bg};overflow:hidden`);
 const g=h('div','',m,null,'grain');
 const c=h('div','position:absolute;inset:0',m);
 const upd=t=>{const tin=E.expo(P(t,0,.42)),tin2=E.expo(P(t,.07,.45));
  const to=E.io(P(t,DUR-.36,.34)),to2=E.io(P(t,DUR-.30,.30));
  a.style.clipPath=`inset(${(1-tin)*100}% 0 ${to*100}% 0)`;
  m.style.clipPath=`inset(${(1-tin2)*100}% 0 ${to2*100}% 0)`;
  g.style.transform=`translate(${(FRAME*37)%200-100}px,${(FRAME*53)%200-100}px)`;
  c.style.transform=`translateY(${(1-tin2)*120-to2*80}px)`;};
 return {c,m,upd};
}
// Overlay card: pop in, shrink out
function OV(el,ox=.5,oy=.5){el.style.transformOrigin=`${ox*100}% ${oy*100}%`;
 return t=>{const i=E.back(P(t,0,.5)),o=E.io(P(t,DUR-.3,.3));
  el.style.transform=`translateY(${(1-i)*60-o*30}px) scale(${L(.86,1,i)*L(1,.9,o)}) rotate(${(1-i)*-2}deg)`;
  el.style.opacity=Math.min(P(t,0,.12),1-o);}}
function kick(parent,txt,color){const k=h('div','',parent,`<span class="dot" style="background:${color||'var(--hot)'}"></span>${txt}`,'kick');return k}
function popIn(el,t,a,d=.45){const x=E.back(P(t,a,d));el.style.opacity=P(t,a,.1);el.style.transform=`translateY(${(1-x)*40}px) scale(${L(.8,1,x)})`;}
function grow(el,t,a,d=.35){el.style.transform=`scaleX(${E.o3(P(t,a,d))})`;}
const X=`<svg viewBox="0 0 40 40" width="38" height="38"><path d="M9 9L31 31M31 9L9 31" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></svg>`;
const CHECK=`<svg viewBox="0 0 40 40" width="40" height="40"><path d="M8 21L17 30L33 11" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ARROW=`<svg viewBox="0 0 40 40" width="40" height="40"><path d="M8 20H32M22 10L32 20L22 30" stroke="currentColor" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

// Generic list card. p:{y,kick,title,items:[{t,at,mark:'x'|'check'|'num'|'q',strikeAt}],dark}
function listCard(p){
 const dark=!!p.dark;
 const card=h('div',`top:${p.y||330}px;${dark?'background:var(--ink);color:var(--paper)':''}`,S,null,'card');
 const k=kick(card,p.kick);k.style.color=dark?'var(--paper)':'var(--ink)';
 let ttl=null;if(p.title){ttl=ml(card,p.title,'margin-top:22px','disp');ttl.parentNode.style.fontSize=(p.tsize||96)+'px';}
 const list=h('div','display:flex;flex-direction:column;gap:22px;margin-top:34px',card);
 const its=p.items.map((it,i)=>{const r=h('div','',list,null,'item');
  const bg=it.mark==='check'?'var(--lime)':it.mark==='x'?'var(--hot)':dark?'var(--paper)':'var(--ink)';
  const fg=it.mark==='x'?'var(--paper)':'var(--ink)';
  const ic=h('div',`background:${bg};color:${it.mark==='num'||it.mark==='q'?(dark?'var(--ink)':'var(--paper)'):fg}`,r,
   it.mark==='check'?CHECK:it.mark==='x'?X:it.mark==='q'?'?':String(i+1).padStart(2,'0'),'ico');
  if(it.mark==='num')ic.style.fontFamily='Mono',ic.style.fontSize='28px';
  const tx=h('div','flex:1',r,it.t);
  let st=null;if(it.strikeAt!=null){st=h('div',`width:${it.sw||600}px`,r,null,'strike');}
  return {r,ic,tx,st,it};});
 const ov=OV(card,.5,0);
 return t=>{ov(t);k.style.opacity=P(t,.1,.2);if(ttl)rise(ttl,t,.15,.6);
  its.forEach(o=>{popIn(o.r,t,o.it.at);if(o.st){grow(o.st,t,o.it.strikeAt);o.tx.style.opacity=L(1,.45,P(t,o.it.strikeAt,.3));}
   const ip=E.el(P(t,o.it.at+.05,.7));o.ic.style.transform=`scale(${ip}) rotate(${(1-ip)*-30}deg)`;});};
}

const SC={};
// ---------- HOOK ----------
SC.hook=p=>{
 const w=h('div','position:absolute;left:60px;top:250px;width:960px');
 const row=h('div','display:flex;gap:16px;flex-wrap:wrap',w);
 const tags=p.tags.map((s,i)=>h('div',`padding:16px 26px;border-radius:999px;font-family:Inter;font-weight:800;font-size:40px;${i?'background:var(--paper);color:var(--ink)':'background:var(--ink);color:var(--paper)'}`,row,s));
 const big=h('div','margin-top:26px',w);
 const l1=ml(big,'<span style="background:var(--ink);color:var(--paper);padding:0 22px">MARKETING</span>','font-size:150px','disp');
 const l2=ml(big,'<span style="background:var(--hot);color:var(--ink);padding:0 22px">DESDE CERO</span>','font-size:150px;margin-top:6px','disp');
 return t=>{tags.forEach((e,i)=>popIn(e,t,p.tagAt[i]));rise(l1,t,p.bigAt,.5);rise(l2,t,p.bigAt+.12,.5);
  const o=E.io(P(t,DUR-.3,.3));w.style.opacity=1-o;w.style.transform=`translateY(${-o*40}px)`;};
};
// ---------- FS big title ----------
SC.fsTitle=p=>{
 const f=FS(p.bg||'var(--ink)',p.accent);
 if(p.grid)h('div','',f.m,null,p.light?'gridp':'grid').style.zIndex=0;
 const wrap=h('div',`position:absolute;left:80px;right:80px;top:${p.top||560}px;color:${p.color||'var(--paper)'}`,f.c);
 let k=null;if(p.kick){k=kick(wrap,p.kick,p.kickDot);k.style.color=p.kickColor||p.color||'var(--paper)';k.style.fontSize='30px';}
 const lines=p.lines.map((s,i)=>ml(wrap,s,`font-size:${p.size||200}px;margin-top:${i?0:30}px`,'disp'));
 let sub=null;if(p.sub){sub=ml(wrap,p.sub,`font-size:${p.subSize||84}px;margin-top:28px;color:${p.subColor||'var(--hot)'}`,'serif');}
 const marks=[];if(p.marks){const r=h('div','display:flex;gap:22px;margin-top:70px',wrap);for(let i=0;i<p.marks;i++)marks.push(h('div','width:110px;height:110px;border-radius:28px;background:var(--hot);color:var(--paper);display:flex;align-items:center;justify-content:center',r,X.replace(/38/g,'60')));}
 return t=>{f.upd(t);if(k)k.style.opacity=P(t,.25,.2);lines.forEach((l,i)=>rise(l,t,.22+i*.09,.6));if(sub)rise(sub,t,p.subAt||.55,.6);
  marks.forEach((m,i)=>{const x=E.el(P(t,(p.marksAt||.6)+i*.12,.8));m.style.transform=`scale(${x}) rotate(${(1-x)*90}deg)`;});
  if(p.shake){const s=P(t,.22,.4);wrap.style.transform=`translateX(${Math.sin(t*90)*(1-s)*14*(s>0)}px)`;}};
};
// ---------- counter FS ----------
SC.counter=p=>{
 const f=FS('var(--ink)');h('div','',f.m,null,'grid');
 const w=h('div','position:absolute;left:80px;right:80px;top:520px;color:var(--paper)',f.c);
 const k=kick(w,p.kick);k.style.fontSize='30px';
 const num=h('div','font-size:250px;margin-top:40px;font-variant-numeric:tabular-nums;white-space:nowrap',w,'0','disp');
 const lab=ml(w,'SEGUIDORES','font-size:110px;color:var(--hot)','disp');
 const pill=h('div','display:inline-flex;align-items:center;gap:18px;margin-top:60px;padding:20px 34px;border-radius:999px;background:var(--paper);color:var(--ink);font-family:Inter;font-weight:900;font-size:56px',w,'<span style="color:var(--hot)">'+X.replace(/38/g,'46')+'</span>INFLUENCER');
 const st=h('div','position:absolute;left:-20px;right:-20px;height:22px;background:var(--hot);top:205px;transform-origin:left;border-radius:12px',w);
 return t=>{f.upd(t);k.style.opacity=P(t,.25,.2);
  const c=E.o3(P(t,.3,p.countEnd-.3));const v=Math.round(c*p.to);num.textContent=v.toLocaleString('es-AR');
  num.style.opacity=P(t,.3,.1);rise(lab,t,.35);popIn(pill,t,p.pillAt);grow(st,t,p.strikeAt,.3);
  num.style.color=t>p.strikeAt?'rgba(243,238,229,.45)':'var(--paper)';};
};
// ---------- metrics FS ----------
SC.metrics=p=>{
 const f=FS('var(--paper)','var(--ink)');h('div','',f.m,null,'gridp');
 const w=h('div','position:absolute;left:80px;right:80px;top:380px;color:var(--ink)',f.c);
 const k=kick(w,p.kick);k.style.fontSize='30px';
 const tiles=p.tiles.map((m,i)=>{const d=h('div','margin-top:30px;background:var(--ink);color:var(--paper);border-radius:34px;padding:34px 44px;display:flex;justify-content:space-between;align-items:center',w);
  h('div','font-size:34px',d,m.l,'mono');const n=h('div','font-size:120px;font-variant-numeric:tabular-nums',d,'0','disp');return {d,n,m};});
 const stamp=h('div','position:absolute;left:110px;top:1300px;padding:22px 40px;border:10px solid var(--hot);color:var(--hot);border-radius:26px;font-size:128px;white-space:nowrap;transform-origin:center',f.c,'≠ PACIENTES','disp');
 return t=>{f.upd(t);k.style.opacity=P(t,.25,.2);
  tiles.forEach(o=>{popIn(o.d,t,o.m.at);const c=E.o3(P(t,o.m.at,1.0));o.n.textContent=o.m.fmt(c*o.m.v);});
  const s=P(t,p.stampAt,.35);stamp.style.opacity=s>0?1:0;stamp.style.transform=`rotate(-6deg) scale(${L(2.2,1,E.o3(s))})`;};
};
// ---------- name card ----------
SC.name=p=>{
 const w=h('div','position:absolute;left:60px;top:250px;width:960px');
 const k=h('div','display:inline-block;background:var(--hot);color:var(--ink);padding:12px 22px;border-radius:12px;font-size:28px',w,'MARKETING PARA MÉDICOS','mono');
 const n1=ml(w,'<span style="background:var(--ink);color:var(--paper);padding:0 22px">GUS PASCANER</span>','font-size:140px;margin-top:20px','disp');
 const row=h('div','display:flex;align-items:center;gap:26px;margin-top:22px',w);
 const num=h('div','background:var(--paper);color:var(--ink);padding:6px 26px;border-radius:24px;font-size:170px;font-variant-numeric:tabular-nums',row,'+0','disp');
 const lab=h('div','font-family:Inter;font-weight:800;font-size:46px;line-height:1.05;color:var(--paper);text-shadow:0 4px 24px rgba(0,0,0,.6)',row,'profesionales<br>de la salud');
 return t=>{popIn(k,t,.05);rise(n1,t,.12,.6);popIn(num,t,p.numAt);popIn(lab,t,p.numAt+.12);
  num.textContent='+'+Math.round(E.o3(P(t,p.numAt,1.1))*300);
  const o=E.io(P(t,DUR-.3,.3));w.style.opacity=1-o;w.style.transform=`translateY(${-o*40}px)`;};
};
// ---------- big word per-char FS ----------
SC.bigword=p=>{
 const f=FS(p.bg||'var(--ink)',p.accent);h('div','',f.m,null,'grid');
 const w=h('div',`position:absolute;left:70px;right:70px;top:${p.top||560}px;color:var(--paper)`,f.c);
 const k=kick(w,p.kick);k.style.fontSize='30px';
 const lines=p.lines.map(s=>{const m=h('div',`font-size:${p.size||230}px;color:${p.color||'var(--hot)'};overflow:hidden;padding:.16em 0 .04em;margin:-.16em 0 -.04em`,w,null,'disp');const d=h('div','',m,s);return split(d)});
 const sub=p.sub?ml(w,p.sub,'font-size:80px;margin-top:40px;color:var(--paper)','serif'):null;
 return t=>{f.upd(t);k.style.opacity=P(t,.25,.2);let n=0;
  lines.forEach(cs=>cs.forEach(c=>{const x=E.expo(P(t,.25+n*.035,.6));c.style.transform=`translateY(${(1-x)*110}%)`;n++;}));
  if(sub)rise(sub,t,p.subAt||.9);};
};
// ---------- calendar FS ----------
SC.calendar=p=>{
 const f=FS('var(--paper)','var(--ink)');h('div','',f.m,null,'gridp');
 const w=h('div','position:absolute;left:90px;right:90px;top:420px',f.c);
 const k=kick(w,'PACIENTES NUEVOS');k.style.color='var(--ink)';k.style.fontSize='30px';
 const cal=h('div','margin-top:34px;background:#fff;border-radius:40px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.18)',w);
 const hd=h('div','background:var(--ink);color:var(--paper);padding:30px 40px;font-size:84px;display:flex;justify-content:space-between;align-items:center',cal,'EL MES QUE VIENE<span style="color:var(--hot)">→</span>','disp');
 const grid=h('div','display:grid;grid-template-columns:repeat(7,1fr);gap:10px;padding:28px',cal);
 const cells=[];for(let i=0;i<28;i++)cells.push(h('div','height:84px;border-radius:14px;background:var(--p1);display:flex;align-items:center;justify-content:center;font-family:Mono;font-weight:700;font-size:26px;color:var(--mute)',grid,String(i+1)));
 const big=h('div','font-size:330px;color:var(--hot);text-align:center;margin-top:30px;font-variant-numeric:tabular-nums',w,'??','disp');
 const sh=ml(w,'ni la más pálida idea','font-size:90px;text-align:center;color:var(--ink);margin-top:-10px','serif');
 return t=>{f.upd(t);k.style.opacity=P(t,.25,.2);popIn(cal,t,.3);
  cells.forEach((c,i)=>{const on=t>.5+i*.02;c.style.opacity=on?1:0;const q=(Math.sin(i*12.9898+Math.floor(t*14))*43758.5)%1;c.style.background=t>p.qAt&&Math.abs(q)<.25?'var(--hot)':'var(--p1)';c.style.color=t>p.qAt&&Math.abs(q)<.25?'var(--paper)':'var(--mute)';c.textContent=t>p.qAt&&Math.abs(q)<.25?'?':String(i+1)});
  popIn(big,t,.7);big.textContent=t<p.qAt?String(Math.floor(Math.abs(Math.sin(FRAME*1.7))*90)).padStart(2,'0'):'¿?';
  rise(sh,t,p.qAt+.1);};
};
// ---------- METHOD reveal ----------
SC.method=p=>{
 const f=FS('var(--ink)');h('div','',f.m,null,'grid');
 const w=h('div','position:absolute;left:70px;right:70px;top:520px;color:var(--paper)',f.c);
 const k=kick(w,'EL SISTEMA PARA ATRAER PACIENTES');k.style.fontSize='28px';
 const s=ml(w,'el método','font-size:130px;margin-top:40px;color:var(--paper)','serif');
 const row=h('div','display:flex;gap:14px;margin-top:20px',w);
 const ls=['I','D','E','A','S'].map((c,i)=>h('div',`flex:1;height:250px;border-radius:30px;display:flex;align-items:center;justify-content:center;font-size:230px;background:${i%2?'var(--paper)':'var(--hot)'};color:var(--ink)`,row,c,'disp'));
 const fl=h('div','position:absolute;inset:0;background:#fff;pointer-events:none',f.m);
 return t=>{f.upd(t);k.style.opacity=P(t,.3,.2);rise(s,t,.3);
  ls.forEach((e,i)=>{const x=E.back(P(t,.55+i*.09,.45));e.style.transform=`translateY(${(1-x)*-300}px) scale(${L(1.4,1,x)}) rotate(${(1-x)*(i%2?8:-8)}deg)`;e.style.opacity=P(t,.55+i*.09,.05);});
  fl.style.opacity=.7*(1-P(t,1.05,.25))*(t>1.0);};
};
// ---------- flow ----------
SC.flow=p=>{
 const card=h('div','top:330px',S,null,'card');
 const k=kick(card,p.kick);
 const nodes=p.nodes.map((n,i)=>{const r=h('div',`margin-top:${i?0:30}px;display:flex;flex-direction:column;align-items:flex-start`,card);
  if(i){const a=h('div','margin:12px 0 12px 40px;color:var(--hot);transform:rotate(90deg);transform-origin:center',r,ARROW);n.arrow=a;}
  const b=h('div',`padding:22px 34px;border-radius:24px;font-size:80px;${i===p.nodes.length-1?'background:var(--hot);color:var(--ink)':i?'background:var(--ink);color:var(--paper)':'background:var(--p3);color:var(--ink)'}`,r,n.t,'disp');n.b=b;return n;});
 const ov=OV(card,.5,0);
 return t=>{ov(t);k.style.opacity=P(t,.1,.2);nodes.forEach(n=>{popIn(n.b,t,n.at);if(n.arrow){n.arrow.style.opacity=P(t,n.at-.15,.15);}});};
};
// ---------- letter intro FS ----------
SC.letter=p=>{
 const f=FS(p.bg||'var(--ink)',p.accent||'var(--paper)');h('div','',f.m,null,p.light?'gridp':'grid');
 const col=p.light?'var(--ink)':'var(--paper)';
 const big=h('div',`position:absolute;right:-40px;top:180px;font-size:1250px;line-height:.8;color:transparent;-webkit-text-stroke:6px ${p.light?'rgba(14,13,12,.18)':'rgba(243,238,229,.16)'}`,f.c,p.l,'disp');

  if(getComputedStyle(e).opacity==='0')continue;r=r?{left:Math.min(r.left,b.left),top:Math.min(r.top,b.top),right:Math.max(r.right,b.right),bottom:Math.max(r.bottom,b.bottom)}:{left:b.left,top:b.top,right:b.right,bottom:b.bottom};}
 if(r){r.width=r.right-r.left;r.height=r.bottom-r.top;}return r;}
function avoidFace(){const SF=window.SAFE;if(!SF||!SF.face)return null;const r=contentBox();if(!r)return null;const [fx0,fy0,fx1,fy1]=SF.face;
 if(r.right<fx0||r.left>fx1||r.bottom<fy0||r.top>fy1)return {mode:'ok'};
 let best=null;for(const [a,b] of SF.zones){const hz=b-a;if(hz<140)continue;const sc=Math.min(1,hz/r.height),top=a+(hz-r.height*sc)/2;
   if(!best||sc>best.sc+.03||(Math.abs(sc-best.sc)<=.03&&Math.abs(top-r.top)<Math.abs(best.top-r.top)))best={sc,top};}
 if(!best)return {mode:'sin lugar'};
 S.style.transformOrigin=`${(r.left+r.right)/2}px ${r.top}px`;S.style.transform=`translateY(${best.top-r.top}px) scale(${best.sc})`;
 return {mode:'movido',scale:+best.sc.toFixed(2),from:Math.round(r.top),to:Math.round(best.top)};}
window.setup=(name,p,dur)=>{S.innerHTML='';S.style.transform='';DUR=dur;UPD=SC[name](p);
 if(!p._place)return null;FRAME=0;UPD(Math.max(0,dur-.4));return avoidFace();};
window.frame=(t,f)=>{FRAME=f;UPD(t);};
</script></body></html>
