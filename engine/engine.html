<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Brico;src:url(fonts/Bricolage.ttf);font-weight:200 800;font-stretch:75% 100%}
@font-face{font-family:Inter;src:url(fonts/InterTight.ttf);font-weight:100 900}
@font-face{font-family:Mono;src:url(fonts/JetBrainsMono.ttf);font-weight:100 800}
@font-face{font-family:Serif;src:url(fonts/InstrumentSerif-Italic.ttf);font-style:italic}
:root{--ink:#0E0D0C;--ink2:#1B1A18;--paper:#F3EEE5;--hot:#FF5A1F;--lime:#D4FF3A;--alt:#D4FF3A;--mute:#8C857A;
 /* tonos derivados (papel→tinta); con una marca se recalculan desde sus colores (scripts/brand.js) */
 --p1:#EFEAE0;--p2:#E9E3D8;--p3:#E6DFD2;--p4:#E2DACB;--p5:#DDD5C7;--p6:#CFC6B6;--t1:#a49d92;--t2:#6c665d;
 --d1:#1c1b19;--d2:#2e2c29;--d3:#3a3834;--d4:#4a463f;--d5:#57524a}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
#stage{position:absolute;inset:0;overflow:hidden}
*{box-sizing:border-box}
#stage,#stage *{hyphens:none;-webkit-hyphens:none;overflow-wrap:normal;word-break:normal}
.disp{font-family:Brico;font-weight:800;font-stretch:76%;letter-spacing:-.02em;line-height:.9;text-transform:uppercase}
.mono{font-family:Mono;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.ui{font-family:Inter}
.serif{font-family:Serif;font-style:italic;font-weight:400;text-transform:none;letter-spacing:-.01em}
.m{overflow:hidden;display:block;padding:.16em 0 .06em;margin:-.16em 0 -.06em}
.m>div{display:block;will-change:transform}
.m.serif{padding-bottom:.24em;margin-bottom:-.24em}
.ch{display:inline-block;will-change:transform}
.grain{position:absolute;inset:-200px;pointer-events:none;opacity:.10;mix-blend-mode:overlay;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:90px 90px}
.gridp{position:absolute;inset:0;background-image:linear-gradient(rgba(0,0,0,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.06) 1px,transparent 1px);background-size:90px 90px}
.card{position:absolute;left:60px;width:960px;background:var(--paper);color:var(--ink);border-radius:36px;padding:44px 48px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.kick{display:inline-flex;align-items:center;gap:14px;font-family:Mono;font-weight:700;font-size:26px;letter-spacing:.12em;text-transform:uppercase}
.dot{width:14px;height:14px;border-radius:50%;background:var(--hot)}
.item{display:flex;align-items:center;gap:26px;font-family:Inter;font-weight:700;font-size:50px;letter-spacing:-.02em;line-height:1.05;position:relative}
.ico{flex:0 0 72px;height:72px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-family:Inter;font-weight:900;font-size:40px}
.strike{position:absolute;left:96px;top:52%;height:7px;background:var(--hot);border-radius:4px;transform-origin:left center}
</style></head><body><div id="stage"></div><script>
const S=document.getElementById('stage');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,d)=>cl((t-a)/(d||1e-6));
const E={o3:x=>1-Math.pow(1-x,3),expo:x=>x>=1?1:1-Math.pow(2,-10*x),
 back:x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)},
 io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
 el:x=>x<=0?0:x>=1?1:Math.pow(2,-10*x)*Math.sin((x*10-.75)*2*Math.PI/3)+1,
 i3:x=>x*x*x};
const L=(a,b,x)=>a+(b-a)*x;
function h(tag,css,parent,html,cls){const e=document.createElement(tag);if(css)e.style.cssText=css;if(cls)e.className=cls;if(html!=null)e.innerHTML=html;(parent||S).appendChild(e);return e}
function ml(parent,html,css,cls){const m=h('div',css||'',parent,null,'m '+(cls||''));return h('div','',m,html)}
// Lenguaje de movimiento por video (p.motion, o arte.json "motion"): sin motion = máscara que sube (el de siempre)
// 'slide' lateral · 'pop' con rebote · 'type' tipeo (revela de izq. a der.) · 'flip' giro 3D · 'blur' foco · 'mask' = default
let MOT=null;
function rise(el,t,a,d=.55,ez=E.expo){const x=ez(P(t,a,d)),q=P(t,a,d);
 if(!MOT||MOT==='mask'){el.style.transform=`translateY(${(1-x)*140}%)`;return;}
 if(MOT==='slide'){el.style.transform=`translateX(${(1-x)*-105}%)`;}
 else if(MOT==='pop'){const b=E.back(q);el.style.transform=`scale(${L(.5,1,b)})`;el.style.transformOrigin='left bottom';el.style.opacity=P(t,a,.08);}
 else if(MOT==='type'){const s=Math.floor(q*14)/14;el.style.clipPath=`inset(-20% ${(1-s)*100}% -20% 0)`;el.style.transform='none';}
 else if(MOT==='flip'){el.style.transform=`perspective(900px) rotateX(${(1-x)*-95}deg)`;el.style.transformOrigin='center bottom';el.style.opacity=P(t,a,.1);}
 else if(MOT==='blur'){el.style.filter=`blur(${(1-x)*22}px)`;el.style.opacity=x;el.style.transform=`scale(${L(1.15,1,x)})`;}
 else el.style.transform=`translateY(${(1-x)*140}%)`;}
function split(el){const txt=el.textContent;el.innerHTML='';return [...txt].map(c=>h('span','',el,c===' '?'&nbsp;':c,'ch'))}
function svg(html,css,parent){const d=h('div',css,parent);d.innerHTML=html;return d}
let DUR=1,FRAME=0;
// ---------- wrappers ----------
// Fullscreen: layered wipe in from bottom, wipe out to top
function FS(bg,accent){
 const a=h('div',`position:absolute;inset:0;background:${accent||'var(--hot)'}`);
 const m=h('div',`position:absolute;inset:0;background:${bg};overflow:hidden`);
 const g=h('div','',m,null,'grain');
 const c=h('div','position:absolute;inset:0',m);
 const upd=t=>{const tin=E.expo(P(t,0,.42)),tin2=E.expo(P(t,.07,.45));
  const to=E.io(P(t,DUR-.36,.34)),to2=E.io(P(t,DUR-.30,.30));
  a.style.clipPath=`inset(${(1-tin)*100}% 0 ${to*100}% 0)`;
  m.style.clipPath=`inset(${(1-tin2)*100}% 0 ${to2*100}% 0)`;
  g.style.transform=`translate(${(FRAME*37)%200-100}px,${(FRAME*53)%200-100}px)`;
  c.style.transform=`translateY(${(1-tin2)*120-to2*80}px)`;};
 return {c,m,upd};
}
// Overlay card: pop in, shrink out
function OV(el,ox=.5,oy=.5){el.style.transformOrigin=`${ox*100}% ${oy*100}%`;
 return t=>{const i=E.back(P(t,0,.5)),o=E.io(P(t,DUR-.3,.3)),x=E.expo(P(t,0,.5));
  if(MOT==='slide')el.style.transform=`translateX(${(1-x)*-140}px) scale(${L(1,.9,o)})`;
  else if(MOT==='flip')el.style.transform=`perspective(1400px) rotateX(${(1-x)*70}deg) scale(${L(1,.9,o)})`;
  else if(MOT==='mask'||MOT==='type'){el.style.clipPath=`inset(0 0 ${(1-x)*100}% 0 round 36px)`;el.style.transform=`translateY(${-o*30}px) scale(${L(1,.9,o)})`;}
  else if(MOT==='pop')el.style.transform=`scale(${L(.4,1,E.el(P(t,0,.8)))*L(1,.9,o)}) rotate(${(1-i)*-4}deg)`;
  else el.style.transform=`translateY(${(1-i)*60-o*30}px) scale(${L(.86,1,i)*L(1,.9,o)}) rotate(${(1-i)*-2}deg)`;
  el.style.opacity=Math.min(P(t,0,.12),1-o);}}
function kick(parent,txt,color){const k=h('div','',parent,`<span class="dot" style="background:${color||'var(--hot)'}"></span>${txt}`,'kick');return k}
function popIn(el,t,a,d=.45){const x=E.back(P(t,a,d));el.style.opacity=P(t,a,.1);el.style.transform=`translateY(${(1-x)*40}px) scale(${L(.8,1,x)})`;}
function grow(el,t,a,d=.35){el.style.transform=`scaleX(${E.o3(P(t,a,d))})`;}
const X=`<svg viewBox="0 0 40 40" width="38" height="38"><path d="M9 9L31 31M31 9L9 31" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></svg>`;
const CHECK=`<svg viewBox="0 0 40 40" width="40" height="40"><path d="M8 21L17 30L33 11" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ARROW=`<svg viewBox="0 0 40 40" width="40" height="40"><path d="M8 20H32M22 10L32 20L22 30" stroke="currentColor" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

// Generic list card. p:{y,kick,title,items:[{t,at,mark:'x'|'check'|'num'|'q',strikeAt}],dark}
function listCard(p){
 if(p.skin&&p.skin!=='card')return skin(LSK,'listCard',p);
 const dark=!!p.dark;
 const card=h('div',`top:${p.y||330}px;${dark?'background:var(--ink);color:var(--paper)':''}`,S,null,'card');
 const k=kick(card,p.kick);k.style.color=dark?'var(--paper)':'var(--ink)';
 let ttl=null;if(p.title){ttl=ml(card,p.title,'margin-top:22px','disp');ttl.parentNode.style.fontSize=(p.tsize||96)+'px';}
 const list=h('div','display:flex;flex-direction:column;gap:22px;margin-top:34px',card);
 const its=p.items.map((it,i)=>{const r=h('div','',list,null,'item');
  const bg=it.mark==='check'?'var(--lime)':it.mark==='x'?'var(--hot)':dark?'var(--paper)':'var(--ink)';
  const fg=it.mark==='x'?'var(--paper)':'var(--ink)';
  const ic=h('div',`background:${bg};color:${it.mark==='num'||it.mark==='q'?(dark?'var(--ink)':'var(--paper)'):fg}`,r,
   it.mark==='check'?CHECK:it.mark==='x'?X:it.mark==='q'?'?':String(i+1).padStart(2,'0'),'ico');
  if(it.mark==='num')ic.style.fontFamily='Mono',ic.style.fontSize='28px';
  const tx=h('div','flex:1',r,it.t);
  let st=null;if(it.strikeAt!=null){st=h('div',`width:${it.sw||600}px`,r,null,'strike');}
  return {r,ic,tx,st,it};});
 const ov=OV(card,.5,0);
 return t=>{ov(t);k.style.opacity=P(t,.1,.2);if(ttl)rise(ttl,t,.15,.6);
  its.forEach(o=>{popIn(o.r,t,o.it.at);if(o.st){grow(o.st,t,o.it.strikeAt);o.tx.style.opacity=L(1,.45,P(t,o.it.strikeAt,.3));}
   const ip=E.el(P(t,o.it.at+.05,.7));o.ic.style.transform=`scale(${ip}) rotate(${(1-ip)*-30}deg)`;});};
}
// ───────── SKINS (p.skin): otra gramática visual para la misma escena. Sin skin = el look de siempre. Paleta y fuentes de la marca (var(--…), Brico/Inter/Mono/Serif) ─────────
function skin(T,name,p){const f=T[p.skin];if(!f)throw new Error(`skin "${p.skin}" no existe para ${name} (hay: ${Object.keys(T).join(', ')})`);return f(p);}
const out3=(el,t,dy=-40)=>{const o=E.io(P(t,DUR-.3,.3));el.style.opacity=1-o;if(o>0)el.style.translate=`0 ${o*dy}px`;};
const HCHK='M6 24 Q12 30 17 36 Q26 18 40 6',HX='M8 8 Q22 20 36 36 M36 8 Q20 22 8 36';
// trazo "a mano" en SVG: devuelve el path para animar con dash()
function hand(parent,d,col,w=6,size=56){const s=svg(`<svg viewBox="0 0 44 44" width="${size}" height="${size}" style="overflow:visible"><path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/></svg>`,`flex:0 0 ${size}px;display:flex`,parent);
 const pa=s.querySelector('path');const len=pa.getTotalLength();pa.style.strokeDasharray=len;pa.style.strokeDashoffset=len;return {s,pa,len};}
const LSK={};
// cuaderno: hoja rayada con margen, letra serif, tildes y tachados dibujados a mano
LSK.notebook=p=>{
 const card=h('div',`top:${p.y||330}px;padding:40px 54px 46px 128px;border-radius:14px;background-color:var(--paper);background-image:repeating-linear-gradient(180deg,transparent 0 78px,color-mix(in srgb,var(--ink) 16%,transparent) 78px 81px);background-position:0 30px;rotate:-1.2deg`,S,null,'card');
 h('div','position:absolute;left:92px;top:0;bottom:0;width:4px;background:var(--hot);opacity:.75',card);
 [.18,.5,.82].forEach(y=>h('div',`position:absolute;left:30px;top:${y*100}%;width:30px;height:30px;border-radius:50%;background:var(--ink);opacity:.16`,card));
 const k=h('div','font-size:68px;line-height:1.15;color:var(--hot)',card,p.kick,'serif');
 let ttl=null;if(p.title){ttl=ml(card,p.title,`margin-top:6px;font-size:${p.tsize||90}px`,'disp');}
 const its=p.items.map((it,i)=>{const r=h('div','display:flex;align-items:flex-start;gap:22px;margin-top:6px;position:relative',card);
  const mk=it.mark==='check'?hand(r,HCHK,'var(--hot)'):it.mark==='x'?hand(r,HX,'var(--hot)'):null;
  if(!mk)h('div','flex:0 0 56px;font-size:64px;line-height:78px;color:var(--hot)',r,it.mark==='q'?'?':(i+1)+'.','serif');else mk.s.style.marginTop='12px';
  const tx=h('div','flex:1;font-family:Serif;font-style:italic;font-size:62px;line-height:79px;color:var(--ink)',r,it.t);
  let st=null;if(it.strikeAt!=null){st=svg(`<svg viewBox="0 0 600 30" width="${it.sw||600}" height="30" preserveAspectRatio="none"><path d="M4 18 Q150 4 300 16 T596 12" fill="none" stroke="var(--hot)" stroke-width="7" stroke-linecap="round"/></svg>`,'position:absolute;left:78px;top:26px',r).querySelector('path');const l=st.getTotalLength();st.style.strokeDasharray=l;st._l=l;}
  return {r,tx,mk,st,it};});
 const ov=OV(card,.5,0);
 return t=>{ov(t);k.style.opacity=P(t,.1,.25);if(ttl)rise(ttl,t,.15,.6);
  its.forEach(o=>{const q=E.o3(P(t,o.it.at,.35));o.r.style.opacity=P(t,o.it.at,.12);o.tx.style.clipPath=`inset(-10% ${(1-q)*100}% -10% 0)`;
   if(o.mk)o.mk.pa.style.strokeDashoffset=o.mk.len*(1-E.o3(P(t,o.it.at+.15,.35)));
   if(o.st){o.st.style.strokeDashoffset=o.st._l*(1-E.o3(P(t,o.it.strikeAt,.35)));o.tx.style.opacity=L(1,.5,P(t,o.it.strikeAt,.3));}});};
};
// notas adhesivas: un papelito por ítem, pegados con cinta, colores de la marca alternados
LSK.sticky=p=>{
 const w=h('div',`position:absolute;left:60px;top:${p.y||300}px;width:960px`);
 const k=h('div','display:inline-block;background:var(--ink);color:var(--paper);padding:12px 22px;border-radius:6px;font-size:26px;rotate:-2deg',w,p.kick,'mono');
 let ttl=null;if(p.title){ttl=ml(w,p.title,`margin-top:16px;font-size:${p.tsize||96}px;color:var(--paper);text-shadow:0 6px 24px rgba(0,0,0,.4)`,'disp');}
 const n=p.items.length,cols=n<=4?2:3,cw=(960-(cols-1)*24)/cols;
 const grid=h('div','display:flex;flex-wrap:wrap;gap:30px 24px;margin-top:34px',w);
 const BG=['var(--lime)','var(--paper)','var(--hot)'];
 const its=p.items.map((it,i)=>{const rot=[-3,2.5,-1.5,3,-2.5,1.5][i%6];
  const d=h('div',`position:relative;width:${cw}px;min-height:${cols===2?300:270}px;padding:50px 30px 30px;background:${BG[i%3]};color:var(--ink);box-shadow:0 18px 40px rgba(0,0,0,.3);font-family:Inter;font-weight:800;font-size:${cols===2?52:42}px;line-height:1.08;letter-spacing:-.02em`,grid);
  h('div','position:absolute;left:50%;top:-16px;width:130px;height:38px;margin-left:-65px;background:color-mix(in srgb,var(--paper) 55%,transparent);rotate:-4deg',d);
  h('div','position:absolute;right:20px;top:12px;font-size:30px;opacity:.75',d,it.mark==='check'?'✓':it.mark==='x'?'✕':it.mark==='q'?'?':String(i+1).padStart(2,'0'),'mono');
  const tx=h('div','',d,it.t);
  let st=null;if(it.strikeAt!=null){st=h('div','position:absolute;left:20px;right:20px;top:55%;height:8px;background:var(--ink);transform-origin:left',d);}
  return {d,tx,st,it,rot};});
 return t=>{popIn(k,t,.02);if(ttl)rise(ttl,t,.12,.6);
  its.forEach(o=>{const x=E.back(P(t,o.it.at,.45));o.d.style.opacity=P(t,o.it.at,.1);o.d.style.transform=`translateY(${(1-x)*-60}px) rotate(${o.rot+(1-x)*12}deg) scale(${L(.7,1,x)})`;
   if(o.st){grow(o.st,t,o.it.strikeAt);o.tx.style.opacity=L(1,.45,P(t,o.it.strikeAt,.3));}});out3(w,t);};
};
// interfaz de app: panel con barra de título, filas que entran deslizando y switches que se prenden
LSK.ui=p=>{
 const card=h('div',`top:${p.y||330}px;padding:0;overflow:hidden;background:var(--ink);color:var(--paper);border-radius:44px`,S,null,'card');
 const hd=h('div','display:flex;align-items:center;gap:14px;padding:30px 40px;border-bottom:3px solid var(--d3)',card);
 ['var(--hot)','var(--lime)','var(--d5)'].forEach(c=>h('div',`width:20px;height:20px;border-radius:50%;background:${c}`,hd));
 h('div','margin-left:16px;font-size:26px;color:var(--t1)',hd,p.kick,'mono');
 let ttl=null;if(p.title){ttl=ml(card,p.title,`margin:30px 40px 0;font-size:${p.tsize||88}px`,'disp');}
 const its=p.items.map((it,i)=>{const r=h('div','display:flex;align-items:center;gap:26px;padding:30px 40px;border-bottom:2px solid var(--d2)',card);
  const ix=h('div','flex:0 0 auto;font-size:28px;color:var(--t1)',r,it.mark==='q'?'?':String(i+1).padStart(2,'0'),'mono');
  const tx=h('div','flex:1;font-family:Inter;font-weight:700;font-size:46px;line-height:1.08;letter-spacing:-.02em',r,it.t);
  const sw=h('div','flex:0 0 100px;height:56px;border-radius:28px;background:var(--d4);position:relative',r);
  const kn=h('div','position:absolute;left:6px;top:6px;width:44px;height:44px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--ink)',sw,it.mark==='x'?X.replace(/38/g,'24'):it.mark==='check'?CHECK.replace(/40/g,'26'):'');
  return {r,tx,sw,kn,it};});
 h('div','height:20px',card);
 const ov=OV(card,.5,0);
 return t=>{ov(t);if(ttl)rise(ttl,t,.15,.6);
  its.forEach(o=>{const x=E.expo(P(t,o.it.at,.45));o.r.style.opacity=P(t,o.it.at,.12);o.r.style.transform=`translateX(${(1-x)*120}px)`;
   const on=E.back(P(t,o.it.at+.3,.35));o.kn.style.left=L(6,50,on)+'px';o.kn.style.opacity=1;
   o.sw.style.background=on>.5?(o.it.mark==='x'?'var(--hot)':o.it.mark==='check'?'var(--lime)':'var(--hot)'):'var(--d4)';
   if(o.it.mark==='x'||o.it.strikeAt!=null)o.tx.style.opacity=L(1,.45,P(t,o.it.strikeAt??o.it.at+.4,.3));});};
};
// terminal: texto mono que se tipea línea por línea, con estado [OK] / [ERROR] / [?]
LSK.terminal=p=>{
 const card=h('div',`top:${p.y||330}px;padding:0;overflow:hidden;background:var(--ink);color:var(--paper);border-radius:28px;border:3px solid var(--d3)`,S,null,'card');
 const hd=h('div','padding:22px 34px;background:var(--d2);font-size:24px;color:var(--t1)',card,'~/'+String(p.kick||'').toLowerCase().replace(/<[^>]+>/g,'').replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-+|-+$/g,''),'mono');
 const body=h('div','padding:30px 34px 40px;font-family:Mono;font-size:40px;line-height:1.35',card);
 if(p.title)h('div','color:var(--hot);margin-bottom:10px',body,'# '+p.title.replace(/<[^>]+>/g,''));
 const its=p.items.map((it,i)=>{const r=h('div','display:flex;gap:20px;margin-top:12px',body);h('div','color:var(--hot)',r,'›');
  const tx=h('div','flex:1',r,'');const tag=h('div','flex:0 0 auto;font-weight:700;color:'+(it.mark==='x'?'var(--hot)':'var(--lime)'),r,it.mark==='x'?'[ERROR]':it.mark==='q'?'[?]':it.mark==='num'?'['+String(i+1).padStart(2,'0')+']':'[OK]');
  return {r,tx,tag,it,s:it.t.replace(/<[^>]+>/g,'')};});
 const ov=OV(card,.5,0);
 return t=>{ov(t);let typing=null;
